name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: version is semver and every version field agrees
        run: |
          node -e "const r=require('./package.json').version,s=require('./server/package.json').version,w=require('./web/package.json').version;const a=require('fs').readFileSync('server/src/app.ts','utf8').match(/VERSION = '([^']+)'/)[1];for(const v of [r,s,w,a]){if(!/^\d+\.\d+\.\d+$/.test(v)){console.error('version is not MAJOR.MINOR.PATCH, got '+v);process.exit(1)}}if(new Set([r,s,w,a]).size!==1){console.error('version fields disagree',{r,s,w,a});process.exit(1)}console.log('version '+r)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx --no -- coherence spec --check
      - run: npm run build
      - run: npm run e2e
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
